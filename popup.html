<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纯黑浏览</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <main>
    <section class="hero"><div class="moon-halo"><img id="mascot" src="icons/awake.svg" width="104" height="104" alt="睁眼的小月亮"></div><div class="hero-title"><h1>纯黑浏览</h1><span id="state-pill">已开启</span></div><button id="shortcut-status" class="shortcut shortcut-settings" title="设置浏览器快捷键" aria-label="设置浏览器快捷键" type="button">快捷键</button><p id="state-description">让页面安静下来，让黑色回到纯黑。</p></section>
    <div class="glass settings">
      <label class="row primary"><span><strong>启用页面配色</strong><small>保留图片与彩色内容</small></span><input class="switch" id="enabled" type="checkbox" role="switch"></label>
    </div>
    <div class="glass preferences">
      <label class="row"><span><strong>在此网站启用</strong><small id="host">正在读取…</small></span><input class="switch" id="site" type="checkbox" role="switch"></label>
    </div>
    <section class="glass palette" aria-label="背景调色盘">
      <div class="swatches" role="group" aria-label="预设背景色">
        <button type="button" class="swatch" data-color="#000000" aria-label="纯黑" title="纯黑" aria-pressed="true"></button>
        <button type="button" class="swatch" data-color="#111111" aria-label="炭黑" title="炭黑" aria-pressed="false"></button>
        <button type="button" class="swatch" data-color="#1c1c1e" aria-label="石墨" title="石墨" aria-pressed="false"></button>
        <button type="button" class="swatch" data-color="#0d1522" aria-label="午夜蓝" title="午夜蓝" aria-pressed="false"></button>
        <button type="button" class="swatch" data-color="#101b18" aria-label="松林绿" title="松林绿" aria-pressed="false"></button>
        <button type="button" class="swatch" data-color="#201a17" aria-label="暖墨" title="暖墨" aria-pressed="false"></button>
      </div>
      <div class="color-row"><label for="background-color">自选颜色</label><div class="color-value"><input id="background-color" type="color" value="#000000" aria-label="选择背景颜色"><input id="hex-color" type="text" value="#000000" maxlength="7" spellcheck="false" aria-label="十六进制背景颜色"></div></div>
      <div class="darkness-label"><label for="darkness">黑色程度</label><output id="darkness-value" for="darkness">100%</output></div>
      <input id="darkness" type="range" min="0" max="100" value="100" aria-label="黑色程度">
      <div class="range-labels"><span>明亮</span><span>深黑</span></div>
    </section>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script src="theme.js"></script><script src="popup.js"></script>
</body></html>
